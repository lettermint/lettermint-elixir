name: CI

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported pair (Elixir 1.15 on OTP 25, which 2.0 needs for
        # :crypto.hash_equals/2), a middle one and the newest.
        include:
          # Hex has no OTP 25 builds for Ubuntu 26.04, which ubuntu-latest now is.
          - elixir: '1.15.8'
            otp: '25.3'
            os: ubuntu-24.04
          - elixir: '1.17.3'
            otp: '27.2'
          - elixir: '1.20.4'
            otp: '29.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/cache@v6
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get --check-locked
      - name: Set release version
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: .github/scripts/set-release-version.sh
      # The generator is private; without it this only verifies the generated headers.
      - name: Check generated code
        if: matrix.elixir == '1.20.4'
        run: scripts/generate.sh --check
      - if: matrix.elixir == '1.20.4'
        run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test --warnings-as-errors
      - if: matrix.elixir == '1.20.4'
        run: mix hex.audit
      - name: Check package and documentation
        if: matrix.elixir == '1.20.4'
        run: |
          mix docs --warnings-as-errors
          mix hex.build
      - uses: actions/upload-artifact@v7
        if: matrix.elixir == '1.20.4'
        with:
          name: package
          path: lettermint-*.tar
          if-no-files-found: error
          retention-days: 30

  # The one check branch protection requires. It fails when a job above failed or
  # was cancelled; skipped jobs count as passed.
  ci:
    name: ci
    if: ${{ always() }}
    needs: [test]
    runs-on: ubuntu-slim
    steps:
      - name: Fail when a job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
